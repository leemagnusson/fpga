# DKMS package for the ctucanfd driver copy in this directory (see ../driver-install.sh).
# It replaces the kernel's own ctucanfd and ctucanfd_pci modules: DKMS installs into
# updates/, which modprobe prefers. PACKAGE_VERSION is CTUCANFD_FPGA2_VERSION in ctucanfd.h.
PACKAGE_NAME="ctucanfd-fpga2"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="ctucanfd"
BUILT_MODULE_NAME[1]="ctucanfd_pci"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
